name: ci
on:
  pull_request:
  push:
    branches: [main]

# A second push to a branch supersedes the run still queued for the first one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # No container.  Pulling nvidia/cuda:12.9.1-devel cost 2 min 8 s of every run;
    # the runner image already carries cmake, gcc and rustup, so the step below adds
    # only nvcc and the CUDA libraries the vendored fork links.  No GPU is needed to
    # build either backend or to run the SIMD tests.
    # Pinned, not ubuntu-latest: the toolkit below is the ubuntu2404 repository's,
    # and nvcc 12.9 refuses a gcc newer than 14, which ubuntu-latest moved past
    # when it became 26.04 (gcc 15).  24.04 ships gcc 13, as the Dockerfile says.
    runs-on: ubuntu-24.04
    env:
      CUDAARCHS: "90"
      CARGO_TERM_COLOR: always
      # Release builds are not incremental anyway, and sccache declines incremental units.
      CARGO_INCREMENTAL: "0"
      # sccache keys on the preprocessed source, so it survives the fresh mtimes a
      # checkout stamps on every file -- which is why caching target/ did not help.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # The fork's build.rs runs cmake over 174 .cu files on every Linux build, the
      # SIMD one included; that was 27 of the 32 minutes.  These two send nvcc and
      # g++ through the same cache, so an unchanged nitroo/ recompiles nothing.
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # The release profile is fat LTO with one codegen unit: minutes per link, on
      # one core, three times per run.  The gate is unchanged -- the test step below
      # still has to reproduce the pinned digests from this build.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4

      - name: CUDA 12.9 toolkit
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-9 cuda-cudart-dev-12-9 libcurand-dev-12-9 cuda-cccl-12-9 cuda-driver-dev-12-9
          # The fork's build.rs names /usr/local/cuda/lib64 literally.
          sudo ln -sfn /usr/local/cuda-12.9 /usr/local/cuda
          echo /usr/local/cuda/lib64 | sudo tee /etc/ld.so.conf.d/cuda.conf
          sudo ldconfig
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"

      - uses: mozilla-actions/sccache-action@v0.0.11

      # Only the downloaded crates, not target/: sccache covers the compiling itself.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('Cargo.lock', 'nitroo/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: build, SIMD backend
        run: cargo build --release --locked
      - name: tests, SIMD backend (pinned synthetic digests)
        run: cargo test --release --locked
      - name: build, CUDA backend
        run: cargo build --release --locked -p zk-prover --features cuda

      - name: compiler cache
        if: always()
        run: sccache --show-stats

  words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: banned words in durable prose
        run: python3 tools/words.py README.md GLOSSARY.md docs/ prover/README.md prover/kernels/README.md harness/README.md nitroo/README.md

  kernels:
    # The install scripts' block markers are a contract with the vendored fork's
    # CMakeLists.txt.  The self-test installs twice and undoes once against a
    # scratch copy of it: standard library only, no store and no card.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the witness-generation install script's self-test
        run: python3 prover/kernels/install_witness_gen_kernels.py --selftest

  harness:
    # The harness's own self-tests.  Every one of them runs on the CPU: no card,
    # no weights and nothing downloaded, which is what lets CI run them at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: harness/uv.lock
      - name: install
        working-directory: harness
        # The default group is the CPU build of torch (harness/README.md).
        run: uv sync --frozen
      - name: every module byte-compiles
        working-directory: harness
        run: uv run python -m compileall -q .
      - name: eval self-test on the CPU
        working-directory: harness
        run: uv run python -m harness.eval.selftest --cpu
      - name: witness and unproved-baseline self-tests
        working-directory: harness
        run: |
          uv run python -m harness.witness.extract --selftest
          uv run python -m harness.witness.shapes --selftest
          uv run python -m harness.witness.plan --selftest
          uv run python -m harness.eval.baseline.decode_bench --selftest
          uv run python -m harness.costmodel.key_tile --selftest
          uv run python -m harness.costmodel.exact_cells --selftest
          uv run python -m harness.costmodel.cost_model --selftest
          uv run python -m harness.eval.predict.witness_fields --selftest
